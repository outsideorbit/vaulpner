---
name: Semantic Version

on:
  workflow_call:
    outputs:
      new_version:
        description: 'New semantic version created'
        value: ${{ jobs.semantic-version.outputs.new_version }}
      has_release:
        description: 'Whether a new release was created'
        value: ${{ jobs.semantic-version.outputs.has_release }}
      previous_version:
        description: 'Previous version number'
        value: ${{ jobs.semantic-version.outputs.previous_version }}
      version_type:
        description: 'Type of version bump (major|minor|patch)'
        value: ${{ jobs.semantic-version.outputs.version_type }}
  workflow_dispatch:

jobs:
  semantic-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install semantic-release
        run: |
          npm i @semantic-release/changelog \
            @semantic-release/github \
            semantic-release-export-data

      - name: Run semantic-release (dry-run)
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run semantic-release in dry-run mode to get version info
          npx semantic-release --dry-run