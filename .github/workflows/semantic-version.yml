---
name: Semantic Version

on:
  workflow_call:
    outputs:
      version:
        description: 'New semantic version created'
        value: ${{ jobs.semantic-version.outputs.version }}
      major:
        description: 'Major version number'
        value: ${{ jobs.semantic-version.outputs.major }}
      minor:
        description: 'Minor version number'
        value: ${{ jobs.semantic-version.outputs.minor }}
      patch:
        description: 'Patch version number'
        value: ${{ jobs.semantic-version.outputs.patch }}
      has_release:
        description: 'Whether a new release was created'
        value: ${{ jobs.semantic-version.outputs.version != '' }}
      previous_version:
        description: 'Previous version number'
        value: ${{ jobs.semantic-version.outputs.previous_version }}
      version_type:
        description: 'Type of version bump (major|minor|patch)'
        value: ${{ jobs.semantic-version.outputs.version_type }}
  workflow_dispatch:

jobs:
  semantic-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      patch: ${{ steps.version.outputs.patch }}
      has_release: ${{ steps.version.outputs.version != '' }}
      previous_version: ${{ steps.version.outputs.previous_version }}
      version_type: ${{ steps.version.outputs.version_type || 'unknown' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get next version
        id: version
        uses: PaulHatch/semantic-version@v5.4.0
        with:
          major_pattern: "/BREAKING CHANGE|BREAKING CHANGES|MAJOR/"
          major_regexp_flags: "i"
          minor_pattern: "/^feat|^feature|^perf|MINOR/"
          minor_regexp_flags: "i"
          bump_each_commit: true
          bump_each_commit_patch_pattern: "/^fix|^refactor|^chore|PATCH/"
          search_commit_body: true

      - name: Display version information
        run: |
          echo "## Version Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Previous Version:** ${{ steps.version.outputs.previous_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Next Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Type:** ${{ steps.version.outputs.version_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Major:** ${{ steps.version.outputs.major }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Minor:** ${{ steps.version.outputs.minor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Patch:** ${{ steps.version.outputs.patch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Increment:** ${{ steps.version.outputs.increment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Is Tagged:** ${{ steps.version.outputs.is_tagged }}" >> $GITHUB_STEP_SUMMARY