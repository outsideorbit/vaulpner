---
name: Semantic Version

on:
  workflow_call:
    outputs:
      new_version:
        description: 'New semantic version created'
        value: ${{ jobs.semantic-version.outputs.new_version }}
      has_release:
        description: 'Whether a new release was created'
        value: ${{ jobs.semantic-version.outputs.has_release }}
      previous_version:
        description: 'Previous version number'
        value: ${{ jobs.semantic-version.outputs.previous_version }}
      version_type:
        description: 'Type of version bump (major|minor|patch)'
        value: ${{ jobs.semantic-version.outputs.version_type }}
  workflow_dispatch:

jobs:
  semantic-version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      has_release: ${{ steps.version.outputs.new_version != '' }}
      previous_version: ${{ steps.version.outputs.previous_version }}
      version_type: ${{ steps.version.outputs.version_type || 'unknown' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install python-semantic-release
        run: |
          pip install python-semantic-release

      - name: Run semantic-release (dry-run)
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run semantic-release in dry-run mode and capture output
          semantic-release version --dry-run > semantic-output.txt 2>&1 >> $GITHUB_STEP_SUMMARY
